[project]
name = "dexscreener-service"
version = "1.0"
description = "FastAPI microservice for DexScreener market and chart data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudscraper==1.2.71",
    "fastapi>=0.141.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<10.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
