services:
  app:
    image: localhost/charts-crawler:latest
    container_name: charts-crawler-app
    restart: unless-stopped
    env_file: ./.env/.env.prod
    environment:
      - PORT=${PORT}
      - HOST=${HOST}
      - MAX_CONCURRENT_CRAWLS=${MAX_CONCURRENT_CRAWLS}
      - DEFAULT_TIMEOUT_SECONDS=${DEFAULT_TIMEOUT_SECONDS}
      - MAX_TIMEOUT_SECONDS=${MAX_TIMEOUT_SECONDS}
      - WEBSOCKET_RECEIVE_TIMEOUT_SECONDS=${WEBSOCKET_RECEIVE_TIMEOUT_SECONDS}
      - WEBSOCKET_IDLE_TIMEOUT_SECONDS=${WEBSOCKET_IDLE_TIMEOUT_SECONDS}
      - BIRDEYE_API_KEY=${BIRDEYE_API_KEY}
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "${PORT}:${PORT}"
    networks:
      - crawlers-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh -c 'ss -ltn | grep -q :${PORT}'"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  crawlers-network:
    external: true
