services:
  app:
    image: localhost/dexscreener-crawler:latest
    container_name: dexscreener-crawler-app
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      - PORT=9098
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9098:9098"
    networks:
      - crawlers-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - dexscreener_logs:/app/logs:Z
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh -c 'ss -ltn | grep -q :9098'"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  crawlers-network:
    external: true

volumes:
  dexscreener_logs:
